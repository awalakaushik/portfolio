<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">Status project illustration</title><desc id="desc">An illustration of a daily workspace with project progress and task lists. This is not a product screenshot.</desc><rect width="800" height="450" fill="#0f172a"/><rect x="60" y="50" width="680" height="350" rx="16" fill="#1e293b" stroke="#334155"/><text x="90" y="95" font-family="system-ui" font-size="24" font-weight="700" fill="#f1f5f9">Status</text><text x="90" y="125" font-family="system-ui" font-size="14" fill="#cbd5e1">What moved forward today?</text><rect x="90" y="155" width="290" height="215" rx="12" fill="#0f172a"/><rect x="410" y="155" width="300" height="215" rx="12" fill="#0f172a"/><text x="110" y="190" font-family="system-ui" font-size="16" fill="#93c5fd">Projects</text><text x="430" y="190" font-family="system-ui" font-size="16" fill="#93c5fd">Today</text><g fill="#334155"><rect x="110" y="220" width="240" height="12" rx="6"/><rect x="110" y="270" width="240" height="12" rx="6"/><rect x="110" y="320" width="240" height="12" rx="6"/></g><g fill="#2dd4bf"><rect x="110" y="220" width="185" height="12" rx="6"/><rect x="110" y="270" width="120" height="12" rx="6"/><rect x="110" y="320" width="215" height="12" rx="6"/></g><g font-family="system-ui" font-size="14" fill="#e2e8f0"><text x="430" y="235">✓ Ship a small improvement</text><text x="430" y="280">✓ Log daily progress</text><text x="430" y="325">○ Plan the next task</text></g></svg>
