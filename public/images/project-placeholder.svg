<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#312e81;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4338ca;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <rect width="800" height="400" fill="url(#grid)"/>
  <circle cx="200" cy="200" r="120" fill="white" fill-opacity="0.03"/>
  <circle cx="600" cy="200" r="80" fill="white" fill-opacity="0.03"/>
  <text x="400" y="200" text-anchor="middle" dominant-baseline="central" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="600" fill="white" fill-opacity="0.6">Project Preview</text>
</svg>
